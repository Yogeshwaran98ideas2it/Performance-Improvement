version: "3.9"

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
      - ./database/init:/docker-entrypoint-initdb.d:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare-network
    restart: unless-stopped

  rabbitmq:
    image: docker.io/library/rabbitmq:3.12-management
    container_name: healthcare-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - healthcare-network
    restart: unless-stopped

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8761:8761"
    networks:
      - healthcare-network
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: audit-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit
      DATASOURCE_USERNAME: audit_app
      DATASOURCE_PASSWORD: ${AUDIT_DB_PASSWORD:-change-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      EUREKA_SERVER: http://discovery-server:8761/eureka/
    ports:
      - "8085:8085"
    networks:
      - healthcare-network
    restart: unless-stopped

  healthcare-api:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: healthcare-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://10.88.0.2:5432/healthcare
      SPRING_DATASOURCE_USERNAME: healthcare_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change-me}
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me}
    ports:
      - "8080:8080"
    volumes:
      - document_storage:/var/healthcare/documents:Z
    networks:
      - healthcare-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_SERVER: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me}
    ports:
      - "8081:8080"
    networks:
      - healthcare-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: healthcare-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data:Z
    networks:
      - healthcare-network
    restart: unless-stopped
    security_opt:
      - label=disable
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: healthcare-logstash
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:Z,ro
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:Z,ro
    ports:
      - "5000:5000"
      - "9600:9600"
    networks:
      - healthcare-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: healthcare-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - healthcare-network
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:v2.48.0
    container_name: healthcare-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z,ro
    ports:
      - "9090:9090"
    networks:
      - healthcare-network
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:10.2.3
    container_name: healthcare-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana:Z
    networks:
      - healthcare-network
    restart: unless-stopped

networks:
  healthcare-network:
    driver: bridge

volumes:
  postgres_data: {}
  elasticsearch_data: {}
  document_storage: {}
  grafana_data: {}



