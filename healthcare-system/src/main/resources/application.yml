spring:
  application:
    name: healthcare-system
  datasource:
    url: jdbc:postgresql://localhost:5432/healthcare
    username: healthcare_app
    password: change-me
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        connection:
          provider_disables_autocommit: true
        envers:
          store_data_at_delete: true
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,logfile
  endpoint:
    health:
      probes:
        enabled: true
  health:
    ldap:
      enabled: false

logging:
  level:
    root: INFO
    com.acme.healthcare: DEBUG
  config: classpath:logback-spring.xml

server:
  port: 8080

multitenant:
  enabled: false
  resolution:
    host-enabled: true
    header-enabled: true
    header-name: X-Tenant-Id
    trusted-tenants:
      - tenant-1
      - tenant-2
  store:
    type: PROFILE
    cache:
      enabled: true
      ttl: 15m
    defaults:
      connection-string: jdbc:postgresql://localhost:5432/healthcare_default
    tenants:
      - id: unique-id-0ff4daf
        identifier: tenant-1
        name: Tenant 1 Company Name
        connection-string: jdbc:postgresql://localhost:5432/tenant1_db
        properties:
          customProperty: VIP Customer
      - id: unique-id-ao41n44
        identifier: tenant-2
        name: Name of Tenant 2
        connection-string: jdbc:postgresql://localhost:5432/tenant2_db

security:
  jwt:
    issuer: healthcare-system
    access-token-ttl-minutes: 30
    refresh-token-ttl-hours: 12
    secret: change-this-secret-to-a-secure-value

storage:
  documents:
    root: ${DOCUMENT_ROOT:/var/healthcare/documents}

messaging:
  audit:
    exchange: ${AUDIT_EXCHANGE:audit.events}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

